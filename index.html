<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good to Buy - Some Best Stocks</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- PapaParse to easily parse CSV from Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-6">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white">Good to Buy for Long Term Plan</h1>
                <p class="text-sm text-gray-400 mt-1">Synced live from your Google Sheet.</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input id="searchInput" type="text" placeholder="Search ticker or company..." 
                    class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500 w-full md:w-64">
                
                <!-- Refresh Button -->
                <button id="refreshBtn" onclick="loadSheetData()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-md cursor-pointer active:scale-95 whitespace-nowrap">
                    <svg id="refreshIcon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Refresh
                </button>
            </div>
        </header>

        <div class="bg-gray-800 rounded-xl shadow-xl overflow-hidden border border-gray-700">
            <div class="overflow-x-auto">
                <table id="dataTable" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700/50 text-gray-300 text-xs uppercase tracking-wider border-b border-gray-700">
                            <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable(0)">Rank ↕</th>
                            <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable(1)">Ticker ↕</th>
                            <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable(2)">Company ↕</th>
                            <th class="py-3 px-4 cursor-pointer hover:text-white text-right" onclick="sortTable(3)">Today's Price ↕</th>
                            <th class="py-3 px-4">My Assessment</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-700 text-sm">
                        <!-- Data populated dynamically via JS -->
                    </tbody>
                </table>
            </div>
        </div>
        <footer class="mt-6 text-center text-xs text-gray-500">
            Auto-synced with Google Sheets. Data delayed as per market source.
        </footer>
    </div>

    <script>
        // REPLACE THIS URL with your published Google Sheet CSV link
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTuG_3xn7oY5-xtXKk80cO1pw1MPFESrq67FBbcyTSpSeFvOuHYCBXhtO9XoKnzT4ODPrh6-YOMTZ05/pub?gid=841600021&single=true&output=csv';

        let tableData = [];

        function loadSheetData() {
            if(!SHEET_CSV_URL.includes('http')) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="py-6 text-center text-yellow-400">Please configure your published Google Sheet CSV URL in the script.</td></tr>`;
                return;
            }

            // Animate refresh icon rotation
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('animate-spin');

            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    tableData = results.data;
                    renderTable(tableData);
                    // Stop animation after short delay
                    setTimeout(() => icon.classList.remove('animate-spin'), 500);
                },
                error: function(err) {
                    console.error('Error fetching sheet data:', err);
                    icon.classList.remove('animate-spin');
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-700/40 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium text-gray-300">${row['Rank'] || ''}</td>
                    <td class="py-3 px-4 font-bold text-blue-400">${row['Ticker'] || ''}</td>
                    <td class="py-3 px-4 text-white">${row['Company'] || ''}</td>
                    <td class="py-3 px-4 text-right font-mono text-emerald-400">${row["Today's Price"] || ''}</td>
                    <td class="py-3 px-4 text-gray-300">${row['My assessment'] || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = tableData.filter(row => 
                (row['Ticker'] && row['Ticker'].toLowerCase().includes(term)) ||
                (row['Company'] && row['Company'].toLowerCase().includes(term))
            );
            renderTable(filtered);
        });

        // Basic Sorting
        let sortDirection = false;
        function sortTable(columnIndex) {
            sortDirection = !sortDirection;
            const keys = ['Rank', 'Ticker', 'Company', "Today's Price", 'My assessment'];
            const key = keys[columnIndex];

            tableData.sort((a, b) => {
                let valA = a[key] || '';
                let valB = b[key] || '';
                
                // Handle numeric sorting for rank/price
                if(columnIndex === 0 || columnIndex === 3) {
                    valA = parseFloat(valA.replace(/[^0-9.-]+/g,"")) || 0;
                    valB = parseFloat(valB.replace(/[^0-9.-]+/g,"")) || 0;
                    return sortDirection ? valA - valB : valB - valA;
                }

                return sortDirection ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });
            renderTable(tableData);
        }

        // Initial data load on page start
        loadSheetData();
    </script>
</body>
</html>
