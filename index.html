<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Alert App - Complete Dynamic Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500/10 text-emerald-400 p-2.5 rounded-xl border border-emerald-500/20 font-bold">📈 SA</div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">Share Alert App</h1>
                    <p class="text-xs text-slate-400">All 25 Stocks Live Dashboard</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <!-- Fully Dynamic Date Selector -->
                <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-400">Select Date:</span>
                    <input type="date" id="dynamicDateInput" value="2026-10-09" onchange="onDateChange(this.value)" class="bg-transparent text-xs font-semibold text-emerald-400 focus:outline-none cursor-pointer">
                </div>
                <button onclick="syncSheetData()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition cursor-pointer shadow-lg shadow-emerald-900/20">
                    Sync Sheet Live
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- Tabs Navigation -->
        <div class="flex border-b border-slate-800 gap-6">
            <button onclick="switchTab('watchlist')" id="btn-watchlist" class="pb-3 text-sm font-semibold border-b-2 border-emerald-500 text-emerald-400 cursor-pointer transition">All 25 Watchlist Stocks</button>
            <button onclick="switchTab('prices')" id="btn-prices" class="pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 cursor-pointer transition">Price History Tracker</button>
            <button onclick="switchTab('deposits')" id="btn-deposits" class="pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 cursor-pointer transition">Deposit History Ledger</button>
        </div>

        <!-- TAB 1: WATCHLIST & SEARCHABLE STOCK -->
        <div id="tab-watchlist" class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">⭐ Searchable High-Upside Watchlist (All 25 Stocks)</h2>
                <input type="text" id="searchStockInput" onkeyup="filterStocks()" placeholder="Search stock by Ticker or Company name..." class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 w-full sm:w-80 shadow-inner">
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table id="stockTable" class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-950/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                                <th class="p-4">Rank</th>
                                <th class="p-4">Ticker</th>
                                <th class="p-4">Company</th>
                                <th class="p-4">Price on <span id="activePriceDate" class="text-emerald-400">2026-10-09</span></th>
                                <th class="p-4">Assessment / Strategy</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody" class="divide-y divide-slate-800">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 2: FULL PRICE HISTORY TABLE -->
        <div id="tab-prices" class="space-y-6 hidden">
            <h2 class="text-lg font-bold text-white">📊 October 2026 Price History Grid</h2>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-950/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                                <th class="p-4">Date</th>
                                <th class="p-4">COIN</th>
                                <th class="p-4">RBLX</th>
                                <th class="p-4">PLTR</th>
                                <th class="p-4">TSLA</th>
                                <th
