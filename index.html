<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Stock Price Extractor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Stock Price Lookup</h2>
    <label for="ticker">Ticker Symbol (e.g., AAPL.US, MSFT.US):</label>
    <input type="text" id="ticker" placeholder="AAPL.US">

    <label for="date">Select Date:</label>
    <input type="date" id="date">

    <button onclick="getStockPrice()">Get Price</button>

    <div id="result"></div>
</div>

<script>
    async function getStockPrice() {
        const ticker = document.getElementById('ticker').value.trim();
        const selectedDate = document.getElementById('date').value;
        const resultDiv = document.getElementById('result');

        if (!ticker || !selectedDate) {
            resultDiv.innerHTML = "Please enter both a ticker and a date.";
            resultDiv.style.color = "red";
            return;
        }

        resultDiv.innerHTML = "Fetching data...";
        resultDiv.style.color = "black";

        // Stooq CSV URL format for daily data
        // Stooq uses extensions like .US for US stocks (e.g., AAPL.US)
        const url = `https://stooq.com/q/d/l/?s=${encodeURIComponent(ticker)}&d1=${selectedDate.replace(/-/g, '')}&d2=${selectedDate.replace(/-/g, '')}&i=d`;
        
        try {
            // Using a CORS proxy to fetch the CSV file securely from the browser
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxyUrl);
            const csvText = await response.text();

            const rows = csvText.trim().split('\n');
            if (rows.length < 2) {
                resultDiv.innerHTML = "No data found for this ticker/date.";
                resultDiv.style.color = "red";
                return;
            }

            // Parse CSV header and row values
            const headers = rows[0].split(',');
            const values = rows[1].split(',');

            const closeIndex = headers.indexOf('Close');
            if (closeIndex === -1 || values[closeIndex] === "N/A" || !values[closeIndex]) {
                resultDiv.innerHTML = "Market closed or invalid ticker/date.";
                resultDiv.style.color = "red";
                return;
            }

            const price = values[closeIndex];
            resultDiv.innerHTML = `Stock: ${ticker.toUpperCase()}<br>Date: ${selectedDate}<br>Closing Price: $${price}`;
            resultDiv.style.color = "green";

        } catch (error) {
            console.error(error);
            resultDiv.innerHTML = "Error fetching data. Check your connection or ticker format.";
            resultDiv.style.color = "red";
        }
    }
</script>

</body>
</html>
