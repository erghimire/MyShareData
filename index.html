<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good to Buy - Live Share Watchlist</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- PapaParse to easily parse CSV from Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-p-6">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white">Good to Buy Watchlist</h1>
                <p class="text-sm text-gray-400 mt-1">Synced live from your Google Sheet.</p>
            </div>
            <div class="mt-4 md:mt-0">
                <input id="searchInput" type="text" placeholder="Search ticker or company..." 
                    class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500 w-64">
            </div>
        </header>

        <div class="bg-gray-800 rounded-xl shadow-xl overflow-hidden border border-gray-700">
            <div class="overflow-x-auto">
                <table id="dataTable" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700/50 text-gray-300 text-xs uppercase tracking-wider border-b border-gray-700">
                            <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable(0)">Rank ↕</th>
                            <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable(1)">Ticker ↕</th>
                            <th class="py-3 px-4 cursor-pointer hover:text-white" onclick="sortTable(2)">Company ↕</th>
                            <th class="py-3 px-4 cursor-pointer hover:text-white text-right" onclick="sortTable(3)">Today's Price ↕</th>
                            <th class="py-3 px-4">My Assessment</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-700 text-sm">
                        <!-- Data populated dynamically via JS -->
                    </tbody>
                </table>
            </div>
        </div>
        <footer class="mt-6 text-center text-xs text-gray-500">
            Auto-synced with Google Sheets. Data delayed as per market source.
        </footer>
    </div>

    <script>
        // REPLACE THIS URL with your published Google Sheet CSV link
        // To get this: In Google Sheets go to File > Share > Publish to web > Select CSV format for the "Good to Buy" tab.
        const SHEET_CSV_URL = 'YOUR_PUBLISHED_CSV_URL_HERE';

        let tableData = [];

        function loadSheetData() {
            if(!SHEET_CSV_URL.includes('http')) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="py-6 text-center text-yellow-400">Please configure your published Google Sheet CSV URL in the script.</td></tr>`;
                return;
            }

            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    tableData = results.data;
                    renderTable(tableData);
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-700/40 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium text-gray-300">${row['Rank'] || ''}</td>
                    <td class="py-3 px-4 font-bold text-blue-400">${row['Ticker'] || ''}</td>
                    <td class="py-3 px-4 text-white">${row['Company'] || ''}</td>
                    <td class="py-3 px-4 text-right font-mono text-emerald-400">${row["Today's Price"] || ''}</td>
                    <td class="py-3 px-4 text-gray-300">${row['My assessment'] || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = tableData.filter(row => 
                (row['Ticker'] && row['Ticker'].toLowerCase().includes(term)) ||
                (row['Company'] && row['Company'].toLowerCase().includes(term))
            );
            renderTable(filtered);
        });

        // Basic Sorting
        let sortDirection = false;
        function sortTable(columnIndex) {
            sortDirection = !sortDirection;
            const keys = ['Rank', 'Ticker', 'Company', "Today's Price", 'My assessment'];
            const key = keys[columnIndex];

            tableData.sort((a, b) => {
                let valA = a[key] || '';
                let valB = b[key] || '';
                
                // Handle numeric sorting for rank/price
                if(columnIndex === 0 || columnIndex === 3) {
                    valA = parseFloat(valA.replace(/[^0-9.-]+/g,"")) || 0;
                    valB = parseFloat(valB.replace(/[^0-9.-]+/g,"")) || 0;
                    return sortDirection ? valA - valB : valB - valA;
                }

                return sortDirection ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });
            renderTable(tableData);
        }

        loadSheetData();
    </script>
</body>
</html>
