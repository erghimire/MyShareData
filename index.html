<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Stock Price Lookup</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Instant Stock Price Lookup</h2>
    <label for="ticker">Ticker Symbol (e.g., AAPL, MSFT):</label>
    <input type="text" id="ticker" placeholder="Type ticker (e.g., AAPL)" oninput="debounceLookup()">

    <label for="date">Select Date:</label>
    <input type="date" id="date" onchange="getStockPrice()">

    <div id="result">Start typing a ticker and pick a date...</div>
</div>

<script>
    let timeout = null;

    // Set today's date by default on load
    document.getElementById('date').valueAsDate = new Date();

    function debounceLookup() {
        clearTimeout(timeout);
        // Wait 500ms after user stops typing to trigger lookup automatically
        timeout = setTimeout(getStockPrice, 500);
    }

    async function getStockPrice() {
        let ticker = document.getElementById('ticker').value.trim().toUpperCase();
        const selectedDate = document.getElementById('date').value;
        const resultDiv = document.getElementById('result');

        if (!ticker) {
            resultDiv.innerHTML = "Please enter a ticker symbol.";
            resultDiv.style.color = "black";
            return;
        }

        if (!selectedDate) {
            resultDiv.innerHTML = "Please select a date.";
            resultDiv.style.color = "black";
            return;
        }

        resultDiv.innerHTML = "Fetching data...";
        resultDiv.style.color = "black";

        // Automatically format with .US behind the scenes
        const formattedTicker = `${ticker}.US`;
        const url = `https://stooq.com/q/d/l/?s=${encodeURIComponent(formattedTicker)}&d1=${selectedDate.replace(/-/g, '')}&d2=${selectedDate.replace(/-/g, '')}&i=d`;
        
        try {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const response = await fetch(proxyUrl);
            const csvText = await response.text();

            const rows = csvText.trim().split('\n');
            if (rows.length < 2) {
                resultDiv.innerHTML = "No data found for this ticker/date. Check if the market was open.";
                resultDiv.style.color = "red";
                return;
            }

            const headers = rows[0].split(',');
            const values = rows[1].split(',');

            const closeIndex = headers.indexOf('Close');
            if (closeIndex === -1 || values[closeIndex] === "N/A" || !values[closeIndex]) {
                resultDiv.innerHTML = "Market closed or invalid ticker/date.";
                resultDiv.style.color = "red";
                return;
            }

            const price = values[closeIndex];
            resultDiv.innerHTML = `Stock: ${ticker}<br>Date: ${selectedDate}<br>Closing Price: $${price}`;
            resultDiv.style.color = "green";

        } catch (error) {
            console.error(error);
            resultDiv.innerHTML = "Error fetching data. Check your connection.";
            resultDiv.style.color = "red";
        }
    }
</script>

</body>
</html>
